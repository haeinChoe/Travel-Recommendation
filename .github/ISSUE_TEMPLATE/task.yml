name: 작업 요청
description: 데이터 분석, 전처리, 추천 실험, 문서 또는 엔지니어링 작업을 정의합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        목적과 완료 조건을 구체적으로 적어주세요. 실제 AI Hub 데이터 접근과 저장소 변경 권한은 아래 항목에서 각각 선택합니다. 데이터 원본·행·자격 증명은 Issue에 붙이지 마세요.

  - type: textarea
    id: purpose
    attributes:
      label: 목적 또는 질문
      description: 해결하려는 문제나 분석으로 답하려는 질문을 적어주세요.
      placeholder: 어떤 근거를 확인하거나 어떤 결과를 얻고 싶은가요?
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: 작업 유형
      options:
        - 데이터·스키마 분석
        - 전처리 파이프라인
        - 추천 모델 실험·평가
        - 기능 구현
        - 테스트·개발 도구
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 관련 근거와 문서
      description: 저장소 문서, 코드북, 공식 데이터 출처, 관련 Issue 등을 연결하세요. 모르는 항목은 미확정으로 표시합니다.
      placeholder: |
        - 대상 데이터셋/권역 (2023): 수도권 / 서부권 / 동부권 / 제주도 및 도서지역
        - 각 대상별 AI Hub 승인 상태:
        - 각 대상의 datasetkey:
        - AI Hub 접근 방식 (MCP 메타데이터 조회 / Shell 목록 조회 / Shell 다운로드):
        - 공식 출처 및 이용 조건 확인 근거:
        - 선택한 filekey 및 파일 목록·용량:
        - 스키마·코드북:
        - 관련 저장소 문서와 근거:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 허용되는 변경, 처리 대상, 분석 범위를 구체적으로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: 함께 수행하지 않을 인접 작업과 결정하지 않을 사항을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 및 검증
      description: 재현 가능한 결과와 확인할 검증 방법을 체크리스트로 적어주세요.
      placeholder: |
        - [ ] 결과 또는 분석 질문에 대한 답
        - [ ] 실행할 검증과 기대 결과
        - [ ] 필요한 경우 재현 명령과 집계 결과 기록
    validations:
      required: true

  - type: dropdown
    id: data_permission
    attributes:
      label: 데이터 접근 권한
      description: 저장소 파일 권한과 별개입니다. MCP는 메타데이터만 조회하며, Shell 다운로드는 선택된 데이터셋의 AI Hub 승인이 완료된 경우에만 허용됩니다.
      options:
        - 데이터 접근 없음 — 승인된 문서·스키마만
        - MCP·Shell 메타데이터 조회 — 파일 다운로드 금지
        - 승인된 AI Hub 데이터 다운로드·data/raw 원본 읽기 및 Git 제외 경로에 파생 결과 작성
        - 승인된 로컬 원본 읽기만 — 파생 파일 작성 금지
        - 승인된 로컬 원본 읽기 및 Git 제외 위치에 파생 결과 작성
    validations:
      required: true

  - type: textarea
    id: data_location_and_safety
    attributes:
      label: 데이터 위치와 취급 조건
      description: 로컬 경로 자체나 행 데이터를 공개하지 말고 환경변수 이름 또는 승인된 위치 별칭을 적으세요. 이용 조건·실행 환경·결과 공유 제한을 기록합니다.
      placeholder: |
        - 로컬 위치 별칭 또는 환경변수:
        - API Key 로컬 설정 여부 (값은 입력하지 않음):
        - 이용 조건 확인 상태와 근거:
        - 허용된 처리 환경:
        - 파생 결과 공유 제한:
    validations:
      required: true

  - type: dropdown
    id: agent_permission
    attributes:
      label: 에이전트 작업 권한
      description: 작업 대상 Issue를 지정할 때 선택된 단계까지 허용됩니다. push·PR 단계도 dev/main 직접 push, 병합, force push는 허용하지 않습니다.
      options:
        - 조사와 진단만 허용 — 파일 변경 금지
        - 파일 수정과 검증까지 허용 — 커밋 금지
        - 검증된 로컬 커밋까지 허용
        - 검증된 로컬 커밋 및 기능 브랜치 push·PR 생성까지 허용 — 병합·force push 금지
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: 미결정 사항과 선행 작업
      description: 없으면 "없음"으로 적으세요. 완료 조건이나 데이터 의미에 영향을 주는 미결정은 구현 전에 해결해야 합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: 브랜치 slug
      description: 작업 브랜치에 사용할 짧은 이름입니다. 권장 형식은 agent/<issue번호>-<slug>입니다.
      placeholder: profile-data-quality
    validations:
      required: true
